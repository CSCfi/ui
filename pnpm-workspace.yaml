packages:
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  nx: false
  puppeteer: true

blockExoticSubdeps: true
ignoreDepScripts: true
minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js

overrides:
  eslint-plugin-prettier: ^5.0.0
  eslint-config-prettier: ^10.0.0
  eslint-import-resolver-typescript: ^4.0.0
  vite: ^7.0.0
  semver: ^7.0.0
  chokidar: ^5.0.0
  undici-types: ^6.25.0
  ws: ^8.0.0
