<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Visual baselines must rasterise identically in the arm64 devcontainer
       (Debian 12) and on ubuntu-latest (24.04). The two distros ship
       different Liberation versions (1.07.4 and 2.1.5) whose OS/2 average
       character width (what sizes a default input box) and outlines differ,
       so the harness bundles one exact set: the Liberation 2.1.5 TTFs in
       ./fonts (SIL Open Font License 1.1, LICENSE beside them), taken from
       https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
       sha256 7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0.
       Every system copy of Liberation is rejected so the bundled files win,
       and the generic families the components fall back to are aliased onto
       them. Passed to Chromium as FONTCONFIG_FILE by vitest.browser.shared.ts;
       fonts.node.spec.ts asks fontconfig that all of this holds.
       A double hyphen is illegal inside an XML comment and once made
       fontconfig reject this whole file, silently for Chromium: never spell a
       CLI flag in here.
       Verify: FONTCONFIG_FILE=$PWD/src/test/fonts.conf fc-match -v sans-serif -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">fonts</dir>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/liberation2/*</glob>
      <glob>/usr/share/fonts/liberation*/*</glob>
    </rejectfont>
  </selectfont>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>museo-sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
