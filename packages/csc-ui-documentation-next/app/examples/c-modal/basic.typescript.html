<c-button>Open modal</c-button>

<c-modal dismissable>
  <c-card>
    <c-card-title>Delete project</c-card-title>

    <c-card-content>
      <p>This action cannot be undone.</p>
    </c-card-content>

    <c-card-actions justify="end">
      <c-button text>Cancel</c-button>

      <c-button danger>Delete</c-button>
    </c-card-actions>
  </c-card>
</c-modal>
