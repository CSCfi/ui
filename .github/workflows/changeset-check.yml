name: Changeset check

# Every PR to main must carry a changeset file so no change can be merged
# without declaring its release impact (ADR-0028). For changes that should
# not trigger a release (docs, CI), commit an explicit empty changeset:
#   pnpm changeset --empty

on:
  pull_request:
    branches:
      - main

jobs:
  require-changeset:
    # The bot-maintained "Version packages" PR consumes changesets and must
    # not be blocked by this check.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset file in the PR
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -E '^\.changeset/.+\.md$' \
              | grep -v '^\.changeset/README\.md$'; then
            echo "Changeset found."
          else
            echo "::error::No changeset in this PR. Run 'pnpm changeset' to describe the release impact, or 'pnpm changeset --empty' for a change that should not release."
            exit 1
          fi
