packages:
  - 'packages/*'

# One version of the test toolchain for every package (`"vitest": "catalog:"`).
# `playwright` is pinned exactly: .devcontainer/Dockerfile bakes the Chromium of
# this version into /ms-playwright, and packages/csc-ui/src/test/toolchain.node.spec.ts
# fails when the two drift — bump both together and rebuild the container.
catalog:
  vitest: 5.0.0
  '@vitest/browser-playwright': 5.0.0
  playwright: 1.60.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  nx: false
  puppeteer: true
  # Never let the install hook download a browser: the devcontainer bakes it,
  # CI runs `playwright install --with-deps chromium` explicitly.
  playwright: false

blockExoticSubdeps: true
minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js

overrides:
  eslint-plugin-prettier: ^5.0.0
  eslint-config-prettier: ^10.0.0
  eslint-import-resolver-typescript: ^4.0.0
  vite: ^7.0.0
  semver: ^7.0.0
  chokidar: ^5.0.0
  undici-types: ^6.25.0
  ws: ^8.0.0
